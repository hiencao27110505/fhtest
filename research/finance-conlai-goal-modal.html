<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — Modal đặt mục tiêu tiết kiệm · 8 kiểu (Apple-grade)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    --ink:#1c1c1e;--ink2:#48484a;--ink3:#8e8e93;--ink4:#aeaeb2;
    --sep:rgba(60,60,67,.13);--fill:#f2f2f5;--fill2:#e8e9ee;
    --teal:#0f9d84;--teal2:#17b8a0;--tealbg:#eaf6f2;
  }
  html,body{background:#e7e9ec;font-family:var(--sf);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{padding:44px 22px 80px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .u{font-size:.62em;font-weight:600;color:var(--ink3);margin-left:.08em}

  .head{max-width:820px;margin:0 auto 6px;text-align:center}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
  .head p{color:var(--ink2);font-size:14px;line-height:1.55;max-width:640px;margin:0 auto}
  .head .tag{display:inline-block;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:var(--tealbg);border-radius:999px;padding:5px 12px}

  .grid{display:flex;flex-wrap:wrap;gap:38px 24px;max-width:1200px;margin:34px auto 0;justify-content:center;align-items:start}
  .item{width:360px}
  .vlab{margin:0 4px 11px}
  .vlab .t{font-weight:700;font-size:14px;letter-spacing:-.01em}
  .vlab .d{color:var(--ink3);font-size:11.5px;margin-top:3px;line-height:1.45}

  /* modal frame: dimmed app behind + bottom sheet */
  .frame{width:360px;border-radius:30px;overflow:hidden;background:#2b2b2e;padding-top:44px;box-shadow:0 24px 60px -12px rgba(20,26,36,.4)}
  .sheet{background:#fff;border-radius:22px 22px 0 0;padding:9px 20px 20px}
  .grab{width:36px;height:5px;border-radius:3px;background:#d6d6db;margin:0 auto 14px}
  .sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .sh-title{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sh-sub{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:4px;line-height:1.45}
  .x{width:28px;height:28px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .x svg{width:14px;height:14px;color:#8a8a90}

  .result{background:var(--tealbg);border-radius:14px;padding:12px 14px;margin-top:16px}
  .result .r1{font-size:13px;font-weight:600;color:#2f7d6c}
  .result .r1 b{font-weight:800;color:var(--teal)}
  .result .r2{font-size:11.5px;font-weight:600;color:#5aa08f;margin-top:3px}
  .btn{display:block;width:100%;margin-top:16px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;font-family:var(--sf);letter-spacing:-.01em}
  .skip{text-align:center;font-size:13px;font-weight:600;color:var(--ink3);margin-top:12px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{flex:1 1 auto;min-width:60px;text-align:center;background:var(--fill);border-radius:11px;padding:11px 6px;font-size:14px;font-weight:700;color:var(--ink2)}
  .chip.on{background:var(--teal);color:#fff}
  .chip.alt{flex-basis:100%;font-size:13px;font-weight:600;color:var(--ink3)}

  /* list */
  .glist{margin-top:14px;border:1px solid var(--sep);border-radius:14px;overflow:hidden}
  .grow{display:flex;align-items:center;gap:12px;padding:13px 14px}
  .grow+.grow{border-top:1px solid var(--sep)}
  .grow.on{background:#f4fbf8}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid #cfd2d7;flex-shrink:0}
  .grow.on .radio{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
  .gmid{flex:1}
  .gp{font-size:14px;font-weight:700}
  .gsub{font-size:11px;color:var(--ink3);font-weight:600;margin-top:1px}
  .gval{font-size:13px;font-weight:700;color:var(--teal);text-align:right}

  /* slider */
  .bignum{text-align:center;margin-top:16px}
  .bignum .b{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--teal);line-height:1}
  .bignum .l{font-size:12px;font-weight:600;color:var(--ink3);margin-top:3px}
  .slider{position:relative;height:8px;border-radius:5px;background:var(--fill2);margin:18px 4px 8px}
  .slider .fl{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal)}
  .slider .knob{position:absolute;top:50%;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.04);transform:translate(-50%,-50%)}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink4);font-weight:600;margin:0 2px}

  /* picker wheel */
  .wheel{position:relative;height:150px;margin-top:12px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent)}
  .wheel .band{position:absolute;left:0;right:0;top:50%;height:38px;transform:translateY(-50%);border-top:1px solid var(--sep);border-bottom:1px solid var(--sep)}
  .wheel ul{list-style:none;position:absolute;left:0;right:0;top:50%;transform:translateY(-19px)}
  .wheel li{height:38px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--ink4)}
  .wheel li.c{color:var(--ink);font-weight:800}

  /* dial */
  .dialwrap{display:flex;justify-content:center;margin-top:14px}
  .dc{position:relative;width:150px;height:150px}
  .dc .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .dc .b{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--teal);line-height:1}
  .dc .l{font-size:11px;font-weight:600;color:var(--ink3);margin-top:2px}

  /* segmented */
  .seg{display:flex;background:var(--fill2);border-radius:11px;padding:3px;margin-top:16px}
  .seg span{flex:1;text-align:center;padding:9px 4px;font-size:13.5px;font-weight:600;color:var(--ink2);border-radius:8px}
  .seg span.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}

  /* stepper */
  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:16px}
  .stepper .rb{width:42px;height:42px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:var(--teal)}
  .stepper .val{font-size:40px;font-weight:800;letter-spacing:-.03em;min-width:110px;text-align:center;color:var(--ink)}
  .qpre{display:flex;gap:8px;margin-top:16px}
  .qpre span{flex:1;text-align:center;background:var(--fill);border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;color:var(--ink3)}
  .qpre span.on{background:var(--tealbg);color:var(--teal)}

  /* amount cards */
  .amts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .amt{background:var(--fill);border-radius:14px;padding:13px 14px}
  .amt.on{background:var(--tealbg);box-shadow:inset 0 0 0 1.5px rgba(15,157,132,.4)}
  .amt .a{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .amt.on .a{color:var(--teal)}
  .amt .s{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
</style>
</head>
<body>

<div class="head">
  <span class="tag">Đặt mục tiêu tiết kiệm</span>
  <h1>Modal “chi ít hơn kỳ trước” — 8 kiểu</h1>
  <p>Chạm vào phần hướng dẫn hằng ngày để mở modal đặt mục tiêu: chi ít hơn kỳ trước 10% · 15% · 20% · 50%. Hạn mức ngày sẽ siết lại theo mục tiêu. Tám kiểu chọn mục tiêu, theo ngôn ngữ Apple.</p>
</div>

<div class="grid" id="root"></div>

<script>
var X='<div class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>';
function money(s){return s+'<span class="u">đ</span>'}
function head(title,sub){return '<div class="sh-head"><div><div class="sh-title">'+title+'</div><div class="sh-sub">'+sub+'</div></div>'+X+'</div>';}
function result(limit,save){return '<div class="result"><div class="r1">Hạn mức ngày mới <b>'+limit+'</b></div><div class="r2">Để dành khoảng '+save+'/tháng</div></div>';}
var CTA='<button class="btn">Đặt mục tiêu</button><div class="skip">Để sau</div>';
var SUB='Kỳ trước mỗi ngày bạn chi ~500.000đ';
function sheet(inner){return '<div class="frame"><div class="sheet"><div class="grab"></div>'+inner+'</div></div>';}

function ring(pct,size,sw,color,trk){var r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100),cc=size/2,kx=cc+r*Math.sin(pct/100*2*Math.PI),ky=cc-r*Math.cos(pct/100*2*Math.PI);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+trk+'" stroke-width="'+sw+'"/><circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cc+' '+cc+')"/><circle cx="'+kx.toFixed(1)+'" cy="'+ky.toFixed(1)+'" r="'+(sw/2+2)+'" fill="#fff" stroke="'+color+'" stroke-width="2.5"/></svg>';}

var V=[
 {t:'Chip phần trăm', d:'Hàng nút phần trăm, chọn nhanh; có “tùy chỉnh”.', s:sheet(
   head('Chi ít hơn kỳ trước','Chọn mức tiết kiệm cho hạn mức mỗi ngày')
   +'<div class="chips"><span class="chip">10%</span><span class="chip">15%</span><span class="chip on">20%</span><span class="chip">50%</span><span class="chip alt">Tùy chỉnh…</span></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Danh sách lựa chọn', d:'Mỗi dòng: mức %, hạn mức mới, số để dành/tháng.', s:sheet(
   head('Mục tiêu tiết kiệm',SUB)
   +'<div class="glist">'
     +'<div class="grow"><span class="radio"></span><div class="gmid"><div class="gp">Ít hơn 10%</div><div class="gsub">450.000đ mỗi ngày</div></div><div class="gval">+1,5tr</div></div>'
     +'<div class="grow"><span class="radio"></span><div class="gmid"><div class="gp">Ít hơn 15%</div><div class="gsub">425.000đ mỗi ngày</div></div><div class="gval">+2,25tr</div></div>'
     +'<div class="grow on"><span class="radio"></span><div class="gmid"><div class="gp">Ít hơn 20%</div><div class="gsub">400.000đ mỗi ngày</div></div><div class="gval">+3tr</div></div>'
     +'<div class="grow"><span class="radio"></span><div class="gmid"><div class="gp">Ít hơn 50%</div><div class="gsub">250.000đ mỗi ngày</div></div><div class="gval">+7,5tr</div></div>'
   +'</div>'+CTA)},

 {t:'Thanh trượt', d:'Kéo từ 0–50%, hạn mức và số để dành cập nhật ngay.', s:sheet(
   head('Chi ít hơn kỳ trước',SUB)
   +'<div class="bignum"><div class="b">20%</div><div class="l">ít hơn kỳ trước</div></div>'
   +'<div class="slider"><span class="fl" style="width:40%"></span><span class="knob" style="left:40%"></span></div>'
   +'<div class="ticks"><span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Bánh xe (picker)', d:'Vặn bánh xe kiểu iOS để chọn mức phần trăm.', s:sheet(
   head('Chi ít hơn kỳ trước',SUB)
   +'<div class="wheel"><div class="band"></div><ul>'
     +'<li>5%</li><li>10%</li><li>15%</li><li class="c">20%</li><li>25%</li><li>30%</li><li>35%</li></ul></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Núm xoay tròn', d:'Núm tròn trực quan, số phần trăm ở giữa.', s:sheet(
   head('Chi ít hơn kỳ trước',SUB)
   +'<div class="dialwrap"><div class="dc">'+ring(40,150,12,'var(--teal)','#e9ebef')+'<div class="mid"><div class="b">20%</div><div class="l">ít hơn kỳ trước</div></div></div></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Segmented control', d:'Thanh phân đoạn quen thuộc của iOS.', s:sheet(
   head('Chi ít hơn kỳ trước','Chọn mức tiết kiệm cho hạn mức mỗi ngày')
   +'<div class="seg"><span>10%</span><span>15%</span><span class="on">20%</span><span>50%</span></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Số lớn + bước', d:'Con số lớn với nút −/+, kèm mức chọn nhanh.', s:sheet(
   head('Chi ít hơn kỳ trước',SUB)
   +'<div class="stepper"><div class="rb">−</div><div class="val">20%</div><div class="rb">+</div></div>'
   +'<div class="qpre"><span>10%</span><span>15%</span><span class="on">20%</span><span>50%</span></div>'
   +result(money('400.000'),money('3.000.000'))+CTA)},

 {t:'Theo số tiền để dành', d:'Chọn theo số để dành mỗi tháng; % suy ra tự động.', s:sheet(
   head('Mỗi tháng để dành thêm','Earthy sẽ siết hạn mức ngày cho vừa')
   +'<div class="amts">'
     +'<div class="amt"><div class="a num">1,5tr</div><div class="s">450.000đ/ngày · 10%</div></div>'
     +'<div class="amt"><div class="a num">2,25tr</div><div class="s">425.000đ/ngày · 15%</div></div>'
     +'<div class="amt on"><div class="a num">3tr</div><div class="s">400.000đ/ngày · 20%</div></div>'
     +'<div class="amt"><div class="a num">7,5tr</div><div class="s">250.000đ/ngày · 50%</div></div>'
   +'</div>'+CTA)}
];
document.getElementById('root').innerHTML=V.map(function(v,i){
  return '<div class="item"><div class="vlab"><div class="t">0'+(i+1)+' · '+v.t+'</div><div class="d">'+v.d+'</div></div>'+v.s+'</div>';
}).join('');
</script>
</body>
</html>
