<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — Trạng thái “đã vượt” · 5 cách cho mỗi kiểu vòng (Apple-grade)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    --ink:#1c1c1e;--ink2:#48484a;--ink3:#8e8e93;--ink4:#aeaeb2;
    --card:#ffffff;--fill6:#f2f2f5;--prevbar:#d9dce1;
    --teal:#0f9d84;--teal2:#17b8a0;--tealbg:#eaf6f2;--red:#e0483f;
  }
  html,body{background:#e7e9ec;font-family:var(--sf);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{padding:44px 22px 80px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .u{font-size:.5em;font-weight:600;color:var(--ink3);margin-left:.12em}

  .head{max-width:820px;margin:0 auto 6px;text-align:center}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
  .head p{color:var(--ink2);font-size:14px;line-height:1.55;max-width:640px;margin:0 auto}
  .head .tag{display:inline-block;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:#fdeeec;border-radius:999px;padding:5px 12px}

  .block{max-width:1140px;margin:0 auto 44px}
  .cap{margin:0 2px 14px;max-width:860px}
  .cap .n{font-size:11px;font-weight:700;color:var(--ink3)}
  .cap .t{font-weight:600;font-size:16px;letter-spacing:-.01em;margin-left:8px}
  .cap .d{margin-top:5px;font-size:12px;line-height:1.5;color:var(--ink3)}
  .states{display:flex;gap:18px;flex-wrap:wrap}
  .scol{width:336px}
  .slab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:0 4px 8px}
  .slab.v{color:var(--red)}

  .w{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(28,28,30,.05),0 16px 36px -14px rgba(28,40,55,.16)}
  .kick{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
  .kick.up{text-transform:uppercase;letter-spacing:.06em}
  .month{font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1}
  .row{display:flex;align-items:center;justify-content:space-between}
  .tile{background:var(--fill6);border-radius:16px;padding:12px 13px}
  .stat .l{font-size:11px;font-weight:600;color:var(--ink3)}
  .stat .v{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

  .wk{display:flex;align-items:flex-end;justify-content:space-between;gap:5px}
  .wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .wc .bars{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .wc i{display:block;width:7px;border-radius:3px}
  .wc i.p{background:var(--prevbar)}.wc i.c{background:var(--teal2)}.wc i.c.o{background:var(--red)}
  .wc em{font-style:normal;font-size:9px;color:var(--ink4);font-weight:600}
  .wc.on em{font-weight:700}

  .dwrap{margin-top:14px}
  .dtile{border-radius:16px;padding:14px}
  .dlabel{font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .dn{font-weight:700;letter-spacing:-.03em;line-height:1}
  .ovwrap{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
  .ex-solid{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;line-height:1}
  .ex-bare{position:absolute;color:var(--red);font-weight:800;font-size:23px;line-height:1}
  .ex-out{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid var(--red);background:#fff;color:var(--red);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1}
  .ex-tri{position:absolute;display:flex;line-height:0}
</style>
</head>
<body>

<div class="head">
  <span class="tag">Trạng thái · đã vượt</span>
  <h1>“Đã vượt” rỗng đỏ — 4 kiểu dấu !</h1>
  <p>Mỗi kiểu vòng: thẻ “còn nhiều” để đối chiếu, bản “rỗng đỏ” gốc, rồi bốn cách thêm dấu ! vào giữa: badge đặc · ! trần · ! viền · tam giác cảnh báo.</p>
</div>

<div id="root"></div>

<script>
var DAYS=['T2','T3','T4','T5','T6','T7','CN'];
function money(s){return s+'<span class="u">đ</span>'}
var RED='#e0483f', REDF='rgba(224,72,63,.22)', REDB='#ff5a4d';
var OK  ={k:'ok', main:'#0f9d84', mut:'#4a917f', bg:'#eaf6f2', trk:'rgba(15,157,132,.18)', pct:76, month:'5.600.000', chi:'8.400.000', t5h:6,  t5cls:'c',   val:'380.000', label:'Hôm nay còn tiêu được'};
var OVER={k:'bad',main:'#e0483f', mut:'#a5645c', bg:'#fdeeec', trk:'rgba(224,72,63,.18)',  pct:100,month:'5.160.000', chi:'8.840.000', t5h:33, t5cls:'c o', val:'60.000',  label:'Hôm nay đã vượt'};

function svg(size,inner){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+inner+'</svg>';}
function ringAt(cc,r,pct,sw,color,trk,cap,op){var c=2*Math.PI*r,off=c*(1-pct/100);
  return (trk!=='none'?'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+trk+'" stroke-width="'+sw+'"/>':'')
    +'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+color+'"'+(op?' stroke-opacity="'+op+'"':'')+' stroke-width="'+sw+'" stroke-linecap="'+(cap||'round')+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cc+' '+cc+')"/>';}
function arc(cx,cy,r,startDeg,sweepDeg){function p(deg){var a=(deg-90)*Math.PI/180;return [(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];}var s=p(startDeg),e=p(startDeg+sweepDeg),l=sweepDeg>180?1:0;return 'M '+s[0]+' '+s[1]+' A '+r+' '+r+' 0 '+l+' 1 '+e[0]+' '+e[1];}

function weekBars(h,st){
  var wk=[{p:26,c:22,cls:'c'},{p:22,c:16,cls:'c'},{p:28,c:17,cls:'c'},{p:22,c:st.t5h,cls:st.t5cls,t:1},{p:20},{p:31},{p:24}];
  return '<div class="wk" style="height:'+(h+14)+'px">'+wk.map(function(d,i){
    var b='<i class="p" style="height:'+(d.p/34*h)+'px"></i>';
    if(d.c!=null) b+='<i class="'+d.cls+'" style="height:'+(d.c/34*h)+'px"></i>';
    var es=d.t?' style="color:'+st.main+'"':'';
    return '<span class="wc'+(d.t?' on':'')+'"><span class="bars" style="height:'+h+'px">'+b+'</span><em'+es+'>'+DAYS[i]+'</em></span>';
  }).join('')+'</div>';
}
function statTile(sym,lab,val,col){return '<div class="tile" style="flex:1"><div class="stat"><div class="l"><span style="color:'+col+'">'+sym+'</span> '+lab+'</div><div class="v num">'+money(val)+'</div></div></div>';}
function cardTop(st){
  return '<div class="kick up">Còn lại tháng này</div>'
    +'<div class="month num" style="font-size:27px;margin-top:5px">'+money(st.month)+'</div>'
    +'<div class="row" style="margin-top:12px;gap:9px">'+statTile('↑','Thu','14.000.000','var(--teal)')+statTile('↓','Chi',st.chi,'var(--ink3)')+'</div>'
    +'<div style="margin-top:13px">'+weekBars(28,st)+'</div>';
}
function circleCard(s,circleHTML){
  return '<div class="dtile" style="background:'+s.bg+'"><div class="row" style="align-items:center">'
    +'<div><div class="dlabel" style="color:'+s.mut+'">'+s.label+'</div><div class="dn num" style="color:'+s.main+';font-size:24px;margin-top:6px">'+money(s.val)+'</div></div>'
    +'<div style="flex-shrink:0;line-height:0">'+circleHTML+'</div></div></div>';
}

/* normal (teal) renderers for the context card */
function P(s){return s.over?100:s.pct}
function nGoc(s){return svg(46,ringAt(23,20.5,s.pct,5,s.main,s.trk,'round'));}
function nTicks(s){var cc=24,ro=23,ri=17,N=28,o='';for(var i=0;i<N;i++){var a=(i/N*360-90)*Math.PI/180,col=(i/N)<(s.pct/100)?s.main:s.trk;o+='<line x1="'+(cc+ri*Math.cos(a)).toFixed(1)+'" y1="'+(cc+ri*Math.sin(a)).toFixed(1)+'" x2="'+(cc+ro*Math.cos(a)).toFixed(1)+'" y2="'+(cc+ro*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';}return svg(48,o);}
function nTwin(s){return svg(46,ringAt(23,20,s.pct,2.5,s.main,s.trk,'round')+ringAt(23,14.5,s.pct,2.5,s.main,'none','round',0.5));}
function nDot(s){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+s.trk+'" stroke-width="2" stroke-dasharray="1.5 4"/>'+ringAt(23,20.5,s.pct,5,s.main,'none','round'));}
function nWave(s){var id='w'+Math.round(s.pct)+'x',r=23,h=46*s.pct/100,y=(46-h).toFixed(1);
  return '<svg width="46" height="46" viewBox="0 0 46 46"><defs><clipPath id="'+id+'"><circle cx="23" cy="23" r="22"/></clipPath></defs><circle cx="23" cy="23" r="22" fill="'+s.trk+'"/><g clip-path="url(#'+id+')"><path d="M 0 '+y+' C 9.2 '+(y-4.5)+', 16 '+(+y+4.5)+', 23 '+y+' S 39 '+(y-4.5)+', 46 '+y+' L 46 46 L 0 46 Z" fill="'+s.main+'"/></g><circle cx="23" cy="23" r="22" fill="none" stroke="'+s.main+'" stroke-opacity=".35" stroke-width="1.5"/></svg>';}
function nDisc(s){var hole=(22*Math.sqrt(1-s.pct/100)).toFixed(1);return svg(46,'<circle cx="23" cy="23" r="22" fill="'+s.main+'"/><circle cx="23" cy="23" r="'+hole+'" fill="'+s.bg+'"/><circle cx="23" cy="23" r="'+hole+'" fill="none" stroke="'+s.main+'" stroke-opacity=".25" stroke-width="1"/></svg>');}

/* over (red) shape renderers: full + empty */
var SH={
 goc:{full:function(){return svg(46,ringAt(23,20.5,100,5,RED,'none','round'));},empty:function(){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+REDF+'" stroke-width="5"/>');}},
 ticks:{full:function(){return ovTicks(RED);},empty:function(){return ovTicks(REDF);}},
 twin:{full:function(){return svg(46,ringAt(23,20,100,2.5,RED,'none','round')+ringAt(23,14.5,100,2.5,RED,'none','round',0.55));},empty:function(){return svg(46,'<circle cx="23" cy="23" r="20" fill="none" stroke="'+REDF+'" stroke-width="2.5"/><circle cx="23" cy="23" r="14.5" fill="none" stroke="'+REDF+'" stroke-width="2.5"/>');}},
 dot:{full:function(){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+REDF+'" stroke-width="2" stroke-dasharray="1.5 4"/>'+ringAt(23,20.5,100,5,RED,'none','round'));},empty:function(){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+REDF+'" stroke-width="2" stroke-dasharray="1.5 4"/>');}},
 wave:{full:function(){return svg(46,'<circle cx="23" cy="23" r="22" fill="'+RED+'"/><circle cx="23" cy="23" r="22" fill="none" stroke="rgba(224,72,63,.4)" stroke-width="1.5"/>');},empty:function(){return svg(46,'<circle cx="23" cy="23" r="22" fill="rgba(224,72,63,.08)"/><circle cx="23" cy="23" r="22" fill="none" stroke="'+REDF+'" stroke-width="1.5"/>');}},
 disc:{full:function(){return svg(46,'<circle cx="23" cy="23" r="22" fill="'+RED+'"/>');},empty:function(){return svg(46,'<circle cx="23" cy="23" r="22" fill="rgba(224,72,63,.08)"/><circle cx="23" cy="23" r="22" fill="none" stroke="'+REDF+'" stroke-width="2"/>');}}
};
function ovTicks(col){var cc=24,ro=23,ri=17,N=28,o='';for(var i=0;i<N;i++){var a=(i/N*360-90)*Math.PI/180;o+='<line x1="'+(cc+ri*Math.cos(a)).toFixed(1)+'" y1="'+(cc+ri*Math.sin(a)).toFixed(1)+'" x2="'+(cc+ro*Math.cos(a)).toFixed(1)+'" y2="'+(cc+ro*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';}return svg(48,o);}

/* overlays */
function exSolid(){return '<div class="ex-solid">!</div>';}
function exBare(){return '<div class="ex-bare">!</div>';}
function exOut(){return '<div class="ex-out">!</div>';}
function exTri(){return '<div class="ex-tri"><svg width="26" height="23" viewBox="0 0 26 23"><path d="M13 2 L24 20.5 Q25.2 22.5 22.8 22.5 L3.2 22.5 Q0.8 22.5 2 20.5 Z" fill="'+RED+'"/><rect x="12" y="8" width="2" height="7" rx="1" fill="#fff"/><circle cx="13" cy="18" r="1.3" fill="#fff"/></svg></div>';}
function wrap(shapeSVG,overlay){return '<div class="ovwrap">'+shapeSVG+(overlay||'')+'</div>';}

var SHAPES=[
 {name:'Vòng bên phải (gốc)', normal:nGoc,  sh:SH.goc},
 {name:'Vòng vạch',           normal:nTicks,sh:SH.ticks},
 {name:'Hai nét mảnh',        normal:nTwin, sh:SH.twin},
 {name:'Track chấm',          normal:nDot,  sh:SH.dot},
 {name:'Mực nước gợn sóng',   normal:nWave, sh:SH.wave},
 {name:'Đĩa thu nhỏ (đảo)',   normal:nDisc, sh:SH.disc}
];

function scol(slab,vcls,s,circleHTML){
  return '<div class="scol"><div class="slab'+(vcls?' v':'')+'">'+slab+'</div><div class="w">'+cardTop(s)+'<div class="dwrap">'+circleCard(s,circleHTML)+'</div></div></div>';
}
var out='';
SHAPES.forEach(function(shape,idx){
  var cards=scol('Còn nhiều · nền',0,OK,shape.normal(OK))
   +scol('Vượt · rỗng đỏ (gốc)',1,OVER,wrap(shape.sh.empty()))
   +scol('Vượt · badge đặc',1,OVER,wrap(shape.sh.empty(),exSolid()))
   +scol('Vượt · ! trần',1,OVER,wrap(shape.sh.empty(),exBare()))
   +scol('Vượt · ! viền',1,OVER,wrap(shape.sh.empty(),exOut()))
   +scol('Vượt · tam giác',1,OVER,wrap(shape.sh.empty(),exTri()));
  out+='<section class="block"><div class="cap"><span class="n">0'+(idx+1)+'</span><span class="t">'+shape.name+'</span><div class="d">Nền “còn nhiều” + rỗng đỏ gốc + 4 kiểu dấu !.</div></div><div class="states">'+cards+'</div></section>';
});
document.getElementById('root').innerHTML=out;
</script>
</body>
</html>
