<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — Vòng bên phải · 8 biến thể vòng tròn (Apple-grade)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    --ink:#1c1c1e;--ink2:#48484a;--ink3:#8e8e93;--ink4:#aeaeb2;
    --card:#ffffff;--fill6:#f2f2f5;--nb:#f4f6f8;--spent:#c9ced4;
    --teal:#0f9d84;--teal2:#17b8a0;--tealbg:#eaf6f2;--prevbar:#d9dce1;
  }
  html,body{background:#e7e9ec;font-family:var(--sf);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{padding:44px 22px 80px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .u{font-size:.5em;font-weight:600;color:var(--ink3);margin-left:.12em}

  .head{max-width:820px;margin:0 auto 4px;text-align:center}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
  .head p{color:var(--ink2);font-size:14px;line-height:1.55;max-width:640px;margin:0 auto}
  .head .tag{display:inline-block;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:var(--tealbg);border-radius:999px;padding:5px 12px}

  .sechead{max-width:1120px;margin:40px auto 20px;padding:0 2px;display:flex;align-items:baseline;gap:12px}
  .sechead .b{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sechead .s{font-size:13px;color:var(--ink3);font-weight:500}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 20px;max-width:1120px;margin:0 auto;justify-items:center;align-items:start}
  @media(max-width:1140px){.grid{grid-template-columns:repeat(2,1fr);max-width:740px}}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .item{width:336px}
  .vlab{margin:0 4px 9px;font-size:12.5px}
  .vlab b{font-weight:700}.vlab .gp{color:var(--teal);font-weight:700}
  .vlab .d{color:var(--ink3);font-size:11px;margin-top:2px;line-height:1.45}

  .w{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(28,28,30,.05),0 16px 36px -14px rgba(28,40,55,.16)}
  .kick{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
  .kick.up{text-transform:uppercase;letter-spacing:.06em}
  .month{font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1}
  .row{display:flex;align-items:center;justify-content:space-between}
  .tile{background:var(--fill6);border-radius:16px;padding:12px 13px}
  .stat .l{font-size:11px;font-weight:600;color:var(--ink3)}
  .stat .v{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

  .wk{display:flex;align-items:flex-end;justify-content:space-between;gap:5px}
  .wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .wc .bars{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .wc i{display:block;width:7px;border-radius:3px}
  .wc i.p{background:var(--prevbar)}.wc i.c{background:var(--teal2)}
  .wc em{font-style:normal;font-size:9px;color:var(--ink4);font-weight:600}
  .wc.on em{color:var(--teal);font-weight:700}

  .dwrap{margin-top:14px}
  .dtile{border-radius:16px;padding:14px}
  .dlabel{font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:1.3;color:#4a917f}
  .dn{font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--teal)}
  .glow{filter:drop-shadow(0 1px 4px rgba(15,157,132,.4))}

  .sbar{position:relative;height:13px;border-radius:7px;overflow:hidden;background:var(--spent)}
  .sbar .rem{position:absolute;top:0;bottom:0;right:0;border-radius:0 7px 7px 0;background:var(--teal)}
  .ends{display:flex;justify-content:space-between;margin-top:7px;font-size:9.5px;font-weight:600;color:#9aa0a6}
</style>
</head>
<body>

<div class="head">
  <span class="tag">Vòng bên phải · circle</span>
  <h1>Vòng tròn — 8 biến thể trên đúng bố cục gốc</h1>
  <p>Giữ nguyên bố cục, màu và thành phần của bản gốc: nhãn và số bên trái, vòng bên phải, nền tint teal. Chỉ thay cách vẽ vòng tròn. Bên cạnh là hai bản gốc để đối chiếu.</p>
</div>

<div id="root"></div>

<script>
var DAYS=['T2','T3','T4','T5','T6','T7','CN'];
function money(s){return s+'<span class="u">đ</span>'}
var TEAL='#0f9d84', TRK='rgba(15,157,132,.18)', TRKG='#d3dbde';
function weekBars(h){
  var wk=[{p:26,c:22},{p:22,c:16},{p:28,c:17},{p:22,c:6,t:1},{p:20},{p:31},{p:24}];
  return '<div class="wk" style="height:'+(h+14)+'px">'+wk.map(function(d,i){
    var b='<i class="p" style="height:'+(d.p/34*h)+'px"></i>';
    if(d.c!=null) b+='<i class="c" style="height:'+(d.c/34*h)+'px"></i>';
    var es=d.t?' style="color:'+TEAL+'"':'';
    return '<span class="wc'+(d.t?' on':'')+'"><span class="bars" style="height:'+h+'px">'+b+'</span><em'+es+'>'+DAYS[i]+'</em></span>';
  }).join('')+'</div>';
}
function statTile(sym,lab,val,col){return '<div class="tile" style="flex:1"><div class="stat"><div class="l"><span style="color:'+col+'">'+sym+'</span> '+lab+'</div><div class="v num">'+money(val)+'</div></div></div>';}
function cardTop(){
  return '<div class="kick up">Còn lại tháng này</div>'
    +'<div class="month num" style="font-size:27px;margin-top:5px">'+money('5.600.000')+'</div>'
    +'<div class="row" style="margin-top:12px;gap:9px">'+statTile('↑','Thu','14.000.000','var(--teal)')+statTile('↓','Chi','8.400.000','var(--ink3)')+'</div>'
    +'<div style="margin-top:13px">'+weekBars(28)+'</div>';
}
/* the original card body: label+number left, circle right, on teal tint */
function circleCard(circleSVG){
  return '<div class="dtile" style="background:#eaf6f2"><div class="row" style="align-items:center">'
    +'<div><div class="dlabel">Hôm nay còn tiêu được</div><div class="dn num" style="font-size:24px;margin-top:6px">'+money('380.000')+'</div></div>'
    +'<div style="flex-shrink:0;line-height:0">'+circleSVG+'</div></div></div>';
}

/* ── circle builders (same 76% remaining, teal, ~46px) ── */
function svg(size,inner,cls){return '<svg '+(cls?'class="'+cls+'" ':'')+'width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+inner+'</svg>';}
function ringAt(cc,r,pct,sw,color,trk,cap){var c=2*Math.PI*r,off=c*(1-pct/100);
  return (trk!=='none'?'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+trk+'" stroke-width="'+sw+'"/>':'')
    +'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="'+(cap||'round')+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cc+' '+cc+')"/>';}
function base(size,sw,cap,trk){return svg(size,ringAt(size/2,(size-sw)/2,76,sw,TEAL,trk||TRK,cap));}
function arc(cx,cy,r,startDeg,sweepDeg){function p(deg){var a=(deg-90)*Math.PI/180;return [(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];}var s=p(startDeg),e=p(startDeg+sweepDeg),l=sweepDeg>180?1:0;return 'M '+s[0]+' '+s[1]+' A '+r+' '+r+' 0 '+l+' 1 '+e[0]+' '+e[1];}

var ORIG_CIRCLE=base(46,5,'round');
var ORIG_BAR='<div class="dtile" style="background:var(--nb)"><div class="row"><div class="dlabel" style="color:#767b82">Hôm nay còn tiêu được</div><div class="dn num" style="font-size:22px">'+money('380.000')+'</div></div><div class="sbar" style="margin-top:12px"><span class="rem" style="width:76%"></span></div><div class="ends"><span>đã tiêu 120.000đ</span><span>trần 500k</span></div></div>';

var CIRCLES=[
 {t:'Đầu vuông',d:'Nét vòng đầu vuông, cảm giác kỹ thuật, gọn.',svg:base(46,5,'butt')},
 {t:'Chấm dẫn đầu',d:'Nét bo tròn kèm núm nhỏ ở đầu cung, kiểu Apple.',svg:(function(){var size=46,sw=5,r=(size-sw)/2,cc=size/2,th=360*0.76*Math.PI/180,dx=(cc+r*Math.sin(th)).toFixed(2),dy=(cc-r*Math.cos(th)).toFixed(2);return svg(size,ringAt(cc,r,76,sw,TEAL,TRK,'round')+'<circle cx="'+dx+'" cy="'+dy+'" r="'+(sw/2+1.3)+'" fill="#fff" stroke="'+TEAL+'" stroke-width="2"/>');})()},
 {t:'Nét đậm',d:'Cùng vòng nhưng nét dày hơn, hiện diện rõ.',svg:base(46,8,'round')},
 {t:'Vòng vạch',d:'Vòng ghép từ các vạch nhỏ đều nhau, sáng dần.',svg:(function(){var size=48,cc=size/2,ro=size/2-1,ri=size/2-7,N=28,s='';for(var i=0;i<N;i++){var a=(i/N*360-90)*Math.PI/180,col=(i/N)<0.76?TEAL:TRKG;s+='<line x1="'+(cc+ri*Math.cos(a)).toFixed(1)+'" y1="'+(cc+ri*Math.sin(a)).toFixed(1)+'" x2="'+(cc+ro*Math.cos(a)).toFixed(1)+'" y2="'+(cc+ro*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';}return svg(size,s);})()},
 {t:'Hai nét mảnh',d:'Hai vòng mảnh đồng tâm, tinh tế, nhẹ nhàng.',svg:svg(46,ringAt(23,20,76,2.5,TEAL,TRK,'round')+ringAt(23,14.5,76,2.5,'rgba(15,157,132,.45)','none','round'))},
 {t:'Khuyết đáy 270°',d:'Vòng hở ở đáy như mặt đồng hồ đo.',svg:(function(){var size=48,cc=size/2,r=(size-6)/2;return svg(size,'<path d="'+arc(cc,cc,r,225,270)+'" fill="none" stroke="'+TRK+'" stroke-width="6" stroke-linecap="round"/><path d="'+arc(cc,cc,r,225,270*0.76)+'" fill="none" stroke="'+TEAL+'" stroke-width="6" stroke-linecap="round"/>');})()},
 {t:'Chuyển sắc',d:'Nét vòng chuyển sắc teal, có ánh sáng nhẹ.',svg:svg(46,'<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17b8a0"/><stop offset="1" stop-color="#0f9d84"/></linearGradient></defs><circle cx="23" cy="23" r="20.5" fill="none" stroke="'+TRK+'" stroke-width="5"/><circle cx="23" cy="23" r="20.5" fill="none" stroke="url(#cg)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*20.5)+'" stroke-dashoffset="'+(2*Math.PI*20.5*0.24)+'" transform="rotate(-90 23 23)"/>','glow')},
 {t:'Track chấm',d:'Đường ray là các chấm nhỏ, cung giá trị liền nét.',svg:svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="rgba(15,157,132,.4)" stroke-width="2" stroke-dasharray="1.5 4"/>'+ringAt(23,20.5,76,5,TEAL,'none','round'))}
];

/* ── filled circles that drain (76% remaining) ── */
var _uid=0;
function pol(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2);}
function fillPie(size){return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:conic-gradient(from -90deg,'+TEAL+' 0 76%,rgba(15,157,132,.16) 76% 100%)"></div>';}
function fillLiquid(size,wave){
  var id='lq'+(_uid++),r=size/2,h=size*0.76,y=(size-h).toFixed(1);
  var top=wave
    ? '<path d="M 0 '+y+' C '+(size*0.2)+' '+(y-5)+', '+(size*0.35)+' '+(+y+5)+', '+(size*0.5)+' '+y+' S '+(size*0.85)+' '+(y-5)+', '+size+' '+y+' L '+size+' '+size+' L 0 '+size+' Z" fill="'+TEAL+'"/>'
    : '<rect x="0" y="'+y+'" width="'+size+'" height="'+h+'" fill="'+TEAL+'"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><defs><clipPath id="'+id+'"><circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'"/></clipPath></defs>'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="rgba(15,157,132,.14)"/>'
    +'<g clip-path="url(#'+id+')">'+top+'</g>'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="none" stroke="rgba(15,157,132,.3)" stroke-width="1.5"/></svg>';
}
function fillShrink(size){var r=size/2;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="rgba(15,157,132,.16)"/><circle cx="'+r+'" cy="'+r+'" r="'+((r-1)*0.87).toFixed(1)+'" fill="'+TEAL+'"/></svg>';}
function fillCoreRing(size){return '<div style="position:relative;width:'+size+'px;height:'+size+'px"><div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(15,157,132,.28)"></div><div style="position:absolute;inset:5px;border-radius:50%;background:conic-gradient(from -90deg,'+TEAL+' 0 76%,rgba(15,157,132,.14) 76% 100%)"></div></div>';}
function fillSeg(size){var cc=size/2,r=size/2-1,s='';for(var i=0;i<10;i++){var a0=i*36+1.4,a1=(i+1)*36-1.4;var lit=(i<7)?1:(i===7?0.45:0.15);var col=(i<7)?TEAL:(i===7?TEAL:'rgba(15,157,132,.16)');var op=i===7?' opacity="0.5"':'';s+='<path d="M '+cc+' '+cc+' L '+pol(cc,cc,r,a0)+' A '+r+' '+r+' 0 0 1 '+pol(cc,cc,r,a1)+' Z" fill="'+col+'"'+op+'/>';}return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+s+'</svg>';}
function fillMoon(size){var r=size/2,rr=r-1,f=0.76,rx=Math.abs(rr*(2*f-1)).toFixed(2),sweep=(2*f-1)>0?0:1;
  var d='M '+r+' '+(r-rr)+' A '+rr+' '+rr+' 0 0 1 '+r+' '+(r+rr)+' A '+rx+' '+rr+' 0 0 '+sweep+' '+r+' '+(r-rr)+' Z';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+r+'" cy="'+r+'" r="'+rr+'" fill="rgba(15,157,132,.16)"/><path d="'+d+'" fill="'+TEAL+'"/><circle cx="'+r+'" cy="'+r+'" r="'+rr+'" fill="none" stroke="rgba(15,157,132,.3)" stroke-width="1.5"/></svg>';}
function fillDonut(size){return svg(size,ringAt(size/2,(size-13)/2,76,13,TEAL,'rgba(15,157,132,.16)','butt'));}

var FILLS=[
 {t:'Đĩa quạt',d:'Đĩa đặc kiểu quạt tròn, phần teal là còn lại.',svg:fillPie(46)},
 {t:'Mực nước phẳng',d:'Đổ đầy như nước, mặt phẳng, vơi dần trong ngày.',svg:fillLiquid(46,false)},
 {t:'Mực nước gợn sóng',d:'Như nước có gợn sóng nhẹ ở mặt, tự nhiên hơn.',svg:fillLiquid(46,true)},
 {t:'Đĩa thu nhỏ',d:'Đĩa đặc co lại khi tiêu; nền mờ là dung lượng đầy.',svg:fillShrink(46)},
 {t:'Lõi quạt trong vòng',d:'Viền tròn là dung lượng, lõi quạt là phần còn lại.',svg:fillCoreRing(46)},
 {t:'Quạt phân đoạn',d:'Đĩa chia múi, các múi sáng là phần còn được tiêu.',svg:fillSeg(46)},
 {t:'Bán nguyệt',d:'Đổ đầy kiểu pha trăng, đường cong mềm.',svg:fillMoon(46)},
 {t:'Vành dày',d:'Vòng dày đặc, vơi dần như rót vơi.',svg:fillDonut(46)}
];

function build(circle){return '<div class="w">'+cardTop()+'<div class="dwrap">'+circle+'</div></div>';}
var out='<div class="sechead"><span class="b">Hai bản gốc</span><span class="s">giữ lại để đối chiếu</span></div><div class="grid">'
 +'<div class="item"><div class="vlab"><b>Vòng bên phải</b> <span class="gp">· gốc</span><div class="d">Bản gốc của vòng tròn.</div></div>'+build(circleCard(ORIG_CIRCLE))+'</div>'
 +'<div class="item"><div class="vlab"><b>Thanh chia</b> <span class="gp">· gốc</span><div class="d">Bản gốc của thanh chia.</div></div>'+build(ORIG_BAR)+'</div>'
 +'</div>';
out+='<div class="sechead"><span class="b">8 biến thể vòng nét</span><span class="s">vòng viền · cùng bố cục · cùng màu · chỉ đổi cách vẽ</span></div><div class="grid">'
 +CIRCLES.map(function(m){return '<div class="item"><div class="vlab"><b>'+m.t+'</b><div class="d">'+m.d+'</div></div>'+build(circleCard(m.svg))+'</div>';}).join('')
 +'</div>';
out+='<div class="sechead"><span class="b">8 biến thể vòng đặc</span><span class="s">đĩa đầy rồi vơi dần · cùng bố cục · cùng màu</span></div><div class="grid">'
 +FILLS.map(function(m){return '<div class="item"><div class="vlab"><b>'+m.t+'</b><div class="d">'+m.d+'</div></div>'+build(circleCard(m.svg))+'</div>';}).join('')
 +'</div>';
document.getElementById('root').innerHTML=out;
</script>
</body>
</html>
