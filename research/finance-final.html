<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — Tài chính · bản chốt (toàn màn hình)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}
  html,body{background:#d7d4dc;font-family:var(--sf);color:#111117;-webkit-font-smoothing:antialiased}
  body{padding:40px 20px 70px}
  .num,.big,.ioval{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .head{text-align:center;max-width:680px;margin:0 auto 10px}
  .head h1{font-size:27px;font-weight:800;letter-spacing:-.7px}
  .head p{color:#847f8e;font-size:14px;margin-top:6px;line-height:1.5}
  .seclab{max-width:840px;margin:30px auto 16px;text-align:center;font-size:15px;font-weight:800;color:#3a3742}
  .seclab span{color:#847f8e;font-weight:600;font-size:13px}
  .row{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
  .col-f{display:flex;flex-direction:column;align-items:center;gap:13px}
  .flab{font-weight:700;font-size:14px;letter-spacing:-.2px}.flab span{color:#847f8e;font-weight:600;font-size:12.5px}

  .frame{width:352px;height:806px;border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#f2f2f6;box-shadow:0 0 0 10px #17171c,0 22px 60px rgba(0,0,0,.3)}
  .st{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;flex-shrink:0}
  .st .tm{font-weight:600;font-size:15px;letter-spacing:.3px}.st .ic{display:flex;gap:6px}
  .b-h{padding:6px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
  .b-h h2{font-size:28px;font-weight:800;letter-spacing:-.9px}
  .pill{font-size:12px;font-weight:600;color:#3a3742;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .scr{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 16px}.scr::-webkit-scrollbar{display:none}
  .tab{height:56px;flex-shrink:0;display:flex;align-items:center;padding-bottom:4px;border-top:1px solid rgba(128,128,128,.18);background:rgba(255,255,255,.9);backdrop-filter:blur(16px)}
  .tab .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#a29caa}
  .tab .tb.on{color:#4f46e5}.tab .tb svg{width:22px;height:22px}

  .c{background:#fff;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px rgba(0,0,0,.055);margin-bottom:11px}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a8694}
  .big{font-weight:800;letter-spacing:-1px;line-height:1}
  .grad{background:linear-gradient(120deg,#4f46e5,#14b8a6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .io2{display:flex;gap:8px;margin-top:13px}
  .iotile{flex:1;background:#f7f6fa;border-radius:12px;padding:10px 12px}
  .iolab{font-size:10.5px;font-weight:600;color:#8a8694}
  .ioval{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-top:3px;color:#111117}.ioval.up{color:#0f9d6c}.ioval.dn{color:#e0483f}

  .note{font-size:12px;font-weight:600;line-height:1.45;padding:9px 12px;border-radius:11px;margin-top:14px}
  .note .ni{margin-right:5px}.note b{font-weight:800;white-space:nowrap}
  .note.down{background:#e7f6f0;color:#0f7a5a}.note.info{background:#eef0fb;color:#4a44a6}
  .note-spark{margin-top:14px;display:flex;align-items:center;gap:11px;background:#f7f6fa;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:600}
  .note-spark .tx{flex:1;color:#3a3448}.note-spark b{font-weight:800}.note-spark svg{flex-shrink:0;display:block}

  .ch{margin-top:15px}
  .chart{display:flex;gap:9px;align-items:flex-end;justify-content:space-between}
  .col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
  .col span{font-size:8.5px;color:#a8a4b0;font-weight:600}
  .bwrap{position:relative;height:74px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .dots{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:11px}
  .dots i{width:5px;height:5px;border-radius:50%;background:#d4d1db}.dots i.on{background:#8a8694;width:15px;border-radius:3px}
  .ov .bprev{position:absolute;bottom:0;width:66%;max-width:20px;border-radius:9px 9px 0 0;background:#e6e3ec}
  .ov .bcur{position:absolute;bottom:0;width:66%;max-width:20px;border-radius:9px 9px 0 0;z-index:1}
  .ov .bcur.g{background:#14b8a6}.ov .bcur.o{background:#e0913a}
  .gr .gbwrap{position:relative;height:74px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
  .gr .gb{width:9px;border-radius:4px 4px 0 0}.gr .gb.prev{background:#e6e3ec}.gr .gb.cur.g{background:#14b8a6}.gr .gb.cur.o{background:#e0483f}

  .grow{display:flex;align-items:center;gap:11px;padding:10px 0}
  .grow+.grow{border-top:1px solid #f0eef4}
  .gem{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#f1f0f5}
  .gmid{flex:1;min-width:0}
  .grow2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gn{font-size:13.5px;font-weight:600;letter-spacing:-.2px;color:#111117}
  .sub{font-size:10.5px;color:#8a8694;font-weight:600}
  .track{height:5px;border-radius:9px;background:#edecf2;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;border-radius:9px}
</style>
</head>
<body>

<div class="head">
  <h1>Tài chính · bản chốt — toàn màn hình</h1>
  <p>Biểu đồ <b>Cột kép</b> (kỳ này teal · ngày vượt tuần trước tô đỏ) · Tích lũy (mục tiêu đơn sắc teal · ghi chú với biểu đồ).</p>
</div>

<div class="row" id="sec-spark"></div>

<script>
  var PREV=[52,56,49,74,52,43,34], CUR=[42,66,29,50,65,null,null], CLS=['g','o','g','g','o',null,null], DAYS=['T2','T3','T4','T5','T6','T7','CN'];
  function chartHTML(type){
    var cols='';
    for(var i=0;i<7;i++){
      var wrap = type==='ov' ? 'bwrap' : 'gbwrap';
      var prevEl = type==='ov' ? '<div class="bprev" style="height:'+PREV[i]+'px"></div>'
                                : '<div class="gb prev" style="height:'+PREV[i]+'px"></div>';
      var curEl = CUR[i]==null ? '' : (type==='ov'
                  ? '<div class="bcur '+CLS[i]+'" style="height:'+CUR[i]+'px"></div>'
                  : '<div class="gb cur '+CLS[i]+'" style="height:'+CUR[i]+'px"></div>');
      cols += '<div class="col"><div class="'+wrap+'">'+prevEl+curEl+'</div><span>'+DAYS[i]+'</span></div>';
    }
    return '<div class="ch"><div class="chart '+type+'">'+cols+'</div><div class="dots"><i class="on"></i><i></i></div></div>';
  }
  function noteHTML(type){
    if(type==='tint') return '<div class="note info"><span class="ni">📈</span>Tháng này để dành thêm <b>2.000.000 ₫</b></div>';
    return '<div class="note-spark"><div class="tx">Tháng này để dành thêm <b>2.000.000 ₫</b></div>'
      + '<svg width="52" height="26" viewBox="0 0 52 26"><polyline points="2,22 12,18 22,19 32,12 42,9 50,4" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="4" r="2.6" fill="#14b8a6"/></svg></div>';
  }
  var STATUS='<div class="st"><span class="tm">9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12"><g fill="#111117"><rect y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" width="3" height="12" rx="1" opacity=".35"/></g></svg><svg width="25" height="12" viewBox="0 0 25 12"><rect x="1" y="1" width="20" height="10" rx="2.6" fill="none" stroke="#111117" stroke-opacity=".4"/><rect x="3" y="3" width="14" height="6" rx="1.2" fill="#111117"/></svg></span></div>';
  var HEADER='<div class="b-h"><h2>Tài chính</h2><span class="pill">Tháng 8 ▾</span></div>';
  var GOALS='<div style="margin-top:8px">'
    +'<div class="grow"><div class="gem">✈️</div><div class="gmid"><div class="grow2"><div class="gn">Du lịch Đà Nẵng</div><div class="sub">8/12tr</div></div><div class="track"><i style="width:67%;background:rgba(18,168,146,.9)"></i></div></div></div>'
    +'<div class="grow"><div class="gem">🛡️</div><div class="gmid"><div class="grow2"><div class="gn">Phòng thân</div><div class="sub">15/15tr</div></div><div class="track"><i style="width:100%;background:rgba(18,168,146,1)"></i></div></div></div>'
    +'<div class="grow"><div class="gem">🚗</div><div class="gmid"><div class="grow2"><div class="gn">Mua xe</div><div class="sub">9/40tr</div></div><div class="track"><i style="width:23%;background:rgba(18,168,146,.5)"></i></div></div></div>'
    +'</div>';
  var TABBAR='<div class="tab"><div class="tb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Nhà</div><div class="tb on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3z"/><path d="M3 10h18"/></svg>Tài chính</div><div class="tb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m5 17 5-4 4 3 2-2 3 3"/></svg>Khoảnh khắc</div></div>';
  function screen(chart, note){
    var conlai='<div class="c"><div class="eyebrow">Còn lại tháng này</div><div class="big grad" style="font-size:34px;margin-top:5px">6.150.000 ₫</div>'
      +'<div class="io2"><div class="iotile"><div class="iolab">↑ Vào</div><div class="ioval up num">22.000.000</div></div><div class="iotile"><div class="iolab">↓ Ra</div><div class="ioval num dn">15.850.000</div></div></div>'
      +chartHTML(chart)
      +'<div class="note down"><span class="ni">▼</span>Giảm <b>180.000 ₫</b> so với cùng kỳ tuần trước</div></div>';
    var tichluy='<div class="c"><div class="eyebrow">Tích lũy</div><div class="big" style="font-size:25px;margin-top:5px">47.000.000 ₫</div>'+GOALS+noteHTML(note)+'</div>';
    return '<div class="frame">'+STATUS+HEADER+'<div class="scr">'+conlai+tichluy+'</div>'+TABBAR+'</div>';
  }
  function cell(chart, label, note){
    return '<div class="col-f"><div class="flab">'+label+'</div>'+screen(chart, note)+'</div>';
  }
  document.getElementById('sec-spark').innerHTML = cell('gr','Bản chốt · Cột kép','spark');
</script>
</body>
</html>
