<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — 6 kiểu vòng tròn × trạng thái (Apple-grade)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    --ink:#1c1c1e;--ink2:#48484a;--ink3:#8e8e93;--ink4:#aeaeb2;
    --card:#ffffff;--fill6:#f2f2f5;--prevbar:#d9dce1;
    --teal:#0f9d84;--teal2:#17b8a0;--tealbg:#eaf6f2;--red:#e0483f;
  }
  html,body{background:#e7e9ec;font-family:var(--sf);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{padding:44px 22px 80px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .u{font-size:.5em;font-weight:600;color:var(--ink3);margin-left:.12em}

  .head{max-width:800px;margin:0 auto 6px;text-align:center}
  .head h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
  .head p{color:var(--ink2);font-size:14px;line-height:1.55;max-width:620px;margin:0 auto}
  .head .tag{display:inline-block;margin-bottom:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:var(--tealbg);border-radius:999px;padding:5px 12px}

  .block{max-width:1140px;margin:0 auto 42px}
  .cap{margin:0 2px 14px;max-width:860px}
  .cap .n{font-size:11px;font-weight:700;color:var(--ink3)}
  .cap .t{font-weight:600;font-size:16px;letter-spacing:-.01em;margin-left:8px}
  .cap .d{margin-top:5px;font-size:12px;line-height:1.5;color:var(--ink3)}
  .states{display:flex;gap:18px;flex-wrap:wrap}
  .scol{width:336px}
  .slab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:0 4px 8px}

  .w{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(28,28,30,.05),0 16px 36px -14px rgba(28,40,55,.16)}
  .kick{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink3)}
  .kick.up{text-transform:uppercase;letter-spacing:.06em}
  .month{font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1}
  .row{display:flex;align-items:center;justify-content:space-between}
  .tile{background:var(--fill6);border-radius:16px;padding:12px 13px}
  .stat .l{font-size:11px;font-weight:600;color:var(--ink3)}
  .stat .v{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin-top:2px}

  .wk{display:flex;align-items:flex-end;justify-content:space-between;gap:5px}
  .wc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .wc .bars{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
  .wc i{display:block;width:7px;border-radius:3px}
  .wc i.p{background:var(--prevbar)}.wc i.c{background:var(--teal2)}.wc i.c.o{background:var(--red)}
  .wc em{font-style:normal;font-size:9px;color:var(--ink4);font-weight:600}
  .wc.on em{font-weight:700}

  .dwrap{margin-top:14px}
  .dtile{border-radius:16px;padding:14px}
  .dlabel{font-size:12px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
  .dn{font-weight:700;letter-spacing:-.03em;line-height:1}
  .ovwrap{position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
  .ex-bare{position:absolute;color:var(--red);font-weight:800;font-size:23px;line-height:1}
</style>
</head>
<body>

<div class="head">
  <span class="tag">6 kiểu vòng · circle</span>
  <h1>Sáu kiểu vòng tròn — xem qua từng trạng thái</h1>
  <p>Sáu hình đã chọn, mỗi hình xem ở ba trạng thái trong ngày: còn nhiều (xanh), sắp chạm (cam) và đã vượt (đỏ). Cả thẻ cùng đổi theo. Bố cục và cách đọc giữ nguyên.</p>
</div>

<div id="root"></div>

<script>
var DAYS=['T2','T3','T4','T5','T6','T7','CN'];
function money(s){return s+'<span class="u">đ</span>'}
var STATES=[
  {k:'ok',  slab:'Sáng · còn nhiều', month:'5.600.000', chi:'8.400.000', t5h:6,  t5cls:'c',   main:'#0f9d84', mut:'#4a917f', bg:'#eaf6f2', trk:'rgba(15,157,132,.18)', pct:76, val:'380.000', label:'Hôm nay còn tiêu được', over:false},
  {k:'warn',slab:'Chiều · sắp chạm', month:'5.310.000', chi:'8.690.000', t5h:24, t5cls:'c',   main:'#c9820a', mut:'#9a7838', bg:'#fdf4e5', trk:'rgba(201,130,10,.20)', pct:18, val:'90.000',  label:'Hôm nay còn tiêu được', over:false},
  {k:'bad', slab:'Tối · đã vượt',    month:'5.160.000', chi:'8.840.000', t5h:33, t5cls:'c o', main:'#e0483f', mut:'#a5645c', bg:'#fdeeec', trk:'rgba(224,72,63,.18)',  pct:100,val:'60.000',  label:'Hôm nay đã vượt', over:true}
];
function P(s){return s.over?100:s.pct}
var _uid=0;
function svg(size,inner){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+inner+'</svg>';}
function ringAt(cc,r,pct,sw,color,trk,cap,op){var c=2*Math.PI*r,off=c*(1-pct/100);
  return (trk!=='none'?'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+trk+'" stroke-width="'+sw+'"/>':'')
    +'<circle cx="'+cc+'" cy="'+cc+'" r="'+r+'" fill="none" stroke="'+color+'"'+(op?' stroke-opacity="'+op+'"':'')+' stroke-width="'+sw+'" stroke-linecap="'+(cap||'round')+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+cc+' '+cc+')"/>';}

function weekBars(h,st){
  var wk=[{p:26,c:22,cls:'c'},{p:22,c:16,cls:'c'},{p:28,c:17,cls:'c'},{p:22,c:st.t5h,cls:st.t5cls,t:1},{p:20},{p:31},{p:24}];
  return '<div class="wk" style="height:'+(h+14)+'px">'+wk.map(function(d,i){
    var b='<i class="p" style="height:'+(d.p/34*h)+'px"></i>';
    if(d.c!=null) b+='<i class="'+d.cls+'" style="height:'+(d.c/34*h)+'px"></i>';
    var es=d.t?' style="color:'+st.main+'"':'';
    return '<span class="wc'+(d.t?' on':'')+'"><span class="bars" style="height:'+h+'px">'+b+'</span><em'+es+'>'+DAYS[i]+'</em></span>';
  }).join('')+'</div>';
}
function statTile(sym,lab,val,col){return '<div class="tile" style="flex:1"><div class="stat"><div class="l"><span style="color:'+col+'">'+sym+'</span> '+lab+'</div><div class="v num">'+money(val)+'</div></div></div>';}
function cardTop(st){
  return '<div class="kick up">Còn lại tháng này</div>'
    +'<div class="month num" style="font-size:27px;margin-top:5px">'+money(st.month)+'</div>'
    +'<div class="row" style="margin-top:12px;gap:9px">'+statTile('↑','Thu','14.000.000','var(--teal)')+statTile('↓','Chi',st.chi,'var(--ink3)')+'</div>'
    +'<div style="margin-top:13px">'+weekBars(28,st)+'</div>';
}
function circleCard(s,circleSVG){
  return '<div class="dtile" style="background:'+s.bg+'"><div class="row" style="align-items:center">'
    +'<div><div class="dlabel" style="color:'+s.mut+'">'+s.label+'</div><div class="dn num" style="color:'+s.main+';font-size:24px;margin-top:6px">'+money(s.val)+'</div></div>'
    +'<div style="flex-shrink:0;line-height:0">'+circleSVG+'</div></div></div>';
}

/* đã vượt = empty-red shape + bare "!" in the center (! trần) */
var REDF='rgba(224,72,63,.24)';
function bareExcl(sv){return '<div class="ovwrap">'+sv+'<div class="ex-bare">!</div></div>';}
function eGoc(){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+REDF+'" stroke-width="5"/>');}
function eTicks(){var cc=24,ro=23,ri=17,N=28,o='';for(var i=0;i<N;i++){var a=(i/N*360-90)*Math.PI/180;o+='<line x1="'+(cc+ri*Math.cos(a)).toFixed(1)+'" y1="'+(cc+ri*Math.sin(a)).toFixed(1)+'" x2="'+(cc+ro*Math.cos(a)).toFixed(1)+'" y2="'+(cc+ro*Math.sin(a)).toFixed(1)+'" stroke="'+REDF+'" stroke-width="3" stroke-linecap="round"/>';}return svg(48,o);}
function eTwin(){return svg(46,'<circle cx="23" cy="23" r="20" fill="none" stroke="'+REDF+'" stroke-width="2.5"/><circle cx="23" cy="23" r="14.5" fill="none" stroke="'+REDF+'" stroke-width="2.5"/>');}
function eDot(){return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+REDF+'" stroke-width="2" stroke-dasharray="1.5 4"/>');}
function eWave(){return svg(46,'<circle cx="23" cy="23" r="22" fill="rgba(224,72,63,.08)"/><circle cx="23" cy="23" r="22" fill="none" stroke="'+REDF+'" stroke-width="1.5"/>');}
function eDisc(){return svg(46,'<circle cx="23" cy="23" r="22" fill="rgba(224,72,63,.08)"/><circle cx="23" cy="23" r="22" fill="none" stroke="'+REDF+'" stroke-width="2"/>');}

/* six circle renderers, parameterized by state (over → ! trần) */
function rGoc(s){if(s.over)return bareExcl(eGoc());return svg(46,ringAt(23,20.5,s.pct,5,s.main,s.trk,'round'));}
function rTicks(s){if(s.over)return bareExcl(eTicks());var cc=24,ro=23,ri=17,N=28,out='';for(var i=0;i<N;i++){var a=(i/N*360-90)*Math.PI/180,col=(i/N)<(s.pct/100)?s.main:s.trk;out+='<line x1="'+(cc+ri*Math.cos(a)).toFixed(1)+'" y1="'+(cc+ri*Math.sin(a)).toFixed(1)+'" x2="'+(cc+ro*Math.cos(a)).toFixed(1)+'" y2="'+(cc+ro*Math.sin(a)).toFixed(1)+'" stroke="'+col+'" stroke-width="3" stroke-linecap="round"/>';}return svg(48,out);}
function rTwin(s){if(s.over)return bareExcl(eTwin());return svg(46,ringAt(23,20,s.pct,2.5,s.main,s.trk,'round')+ringAt(23,14.5,s.pct,2.5,s.main,'none','round',0.5));}
function rDot(s){if(s.over)return bareExcl(eDot());return svg(46,'<circle cx="23" cy="23" r="20.5" fill="none" stroke="'+s.trk+'" stroke-width="2" stroke-dasharray="1.5 4"/>'+ringAt(23,20.5,s.pct,5,s.main,'none','round'));}
function rWave(s){if(s.over)return bareExcl(eWave());var id='lq'+(_uid++),size=46,r=size/2,h=size*s.pct/100,y=(size-h).toFixed(1);
  var top='<path d="M 0 '+y+' C '+(size*0.2)+' '+(y-4.5)+', '+(size*0.35)+' '+(+y+4.5)+', '+(size*0.5)+' '+y+' S '+(size*0.85)+' '+(y-4.5)+', '+size+' '+y+' L '+size+' '+size+' L 0 '+size+' Z" fill="'+s.main+'"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><defs><clipPath id="'+id+'"><circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'"/></clipPath></defs>'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="'+s.trk+'"/>'
    +'<g clip-path="url(#'+id+')">'+top+'</g>'
    +'<circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="none" stroke="'+s.main+'" stroke-opacity=".35" stroke-width="1.5"/></svg>';}
function rShrinkRev(s){if(s.over)return bareExcl(eDisc());var R=22;
  var hole=(R*Math.sqrt(1-s.pct/100)).toFixed(1);
  return svg(46,'<circle cx="23" cy="23" r="'+R+'" fill="'+s.main+'"/><circle cx="23" cy="23" r="'+hole+'" fill="'+s.bg+'"/><circle cx="23" cy="23" r="'+hole+'" fill="none" stroke="'+s.main+'" stroke-opacity=".25" stroke-width="1"/></svg>');}

var TREATS=[
 {t:'Vòng bên phải (gốc)', d:'Vòng viền mảnh, cung là phần còn lại.', fn:rGoc},
 {t:'Vòng vạch', d:'Vòng ghép từ các vạch nhỏ, sáng dần theo phần còn lại.', fn:rTicks},
 {t:'Hai nét mảnh', d:'Hai vòng mảnh đồng tâm, tinh tế nhẹ nhàng.', fn:rTwin},
 {t:'Track chấm', d:'Đường ray là các chấm nhỏ, cung giá trị liền nét.', fn:rDot},
 {t:'Mực nước gợn sóng', d:'Đổ đầy như nước có gợn sóng, vơi dần trong ngày.', fn:rWave},
 {t:'Đĩa thu nhỏ (đảo)', d:'Đĩa đặc rỗng dần từ trong ra; phần teal là còn lại.', fn:rShrinkRev}
];

var out='';
TREATS.forEach(function(m,idx){
  var cards=STATES.map(function(s){
    return '<div class="scol"><div class="slab">'+s.slab+'</div><div class="w">'+cardTop(s)+'<div class="dwrap">'+circleCard(s,m.fn(s))+'</div></div></div>';
  }).join('');
  out+='<section class="block"><div class="cap"><span class="n">0'+(idx+1)+'</span><span class="t">'+m.t+'</span><div class="d">'+m.d+'</div></div><div class="states">'+cards+'</div></section>';
});
document.getElementById('root').innerHTML=out;
</script>
</body>
</html>
