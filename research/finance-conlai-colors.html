<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Earthy — Còn lại · Cột kép · 8 cách dùng màu</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{--sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}
  html,body{background:#dcdae1;font-family:var(--sf);color:#111117;-webkit-font-smoothing:antialiased}
  body{padding:40px 20px 70px}
  .num,.big,.ioval{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .page-head{max-width:820px;margin:0 auto 26px;text-align:center}
  .page-head h1{font-size:27px;font-weight:800;letter-spacing:-.9px;margin-bottom:7px}
  .page-head p{color:#4b4753;font-size:14px;line-height:1.55;max-width:600px;margin:0 auto}

  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 18px;max-width:1404px;margin:0 auto;justify-items:center}
  .v{width:330px}
  .cap{margin:0 4px 9px}
  .cap .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;border-radius:7px;background:#111;color:#fff;font-weight:800;font-size:11px;margin-right:8px;vertical-align:1px}
  .cap .t{font-weight:700;font-size:13px;letter-spacing:-.2px}

  .c{background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.06)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a8694}
  .big{font-weight:800;letter-spacing:-1px;line-height:1}
  .grad{background:linear-gradient(120deg,#4f46e5,#14b8a6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .io2{display:flex;gap:8px;margin-top:12px}
  .iotile{flex:1;background:#f7f6fa;border-radius:12px;padding:9px 11px}
  .iolab{font-size:10px;font-weight:600;color:#8a8694}
  .ioval{font-size:14px;font-weight:800;letter-spacing:-.3px;margin-top:2px;color:#111117}.ioval.up{color:#0f9d6c}
  .note{font-size:11.5px;font-weight:600;line-height:1.4;padding:8px 11px;border-radius:11px;margin-top:13px;background:#e7f6f0;color:#0f7a5a}
  .note .ni{margin-right:5px}.note b{font-weight:800;white-space:nowrap}

  .ch{margin-top:13px}
  .chart{display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
  .col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
  .col span{font-size:8px;color:#a8a4b0;font-weight:600}
  .gbwrap{position:relative;height:70px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
  .gb{width:9px;border-radius:4px 4px 0 0}
  .dots{display:flex;gap:5px;justify-content:center;align-items:center;margin-top:10px}
  .dots i{width:5px;height:5px;border-radius:50%;background:#d4d1db}.dots i.on{background:#8a8694;width:14px;border-radius:3px}

  /* color schemes */
  .cs1 .gb.prev{background:#eeecf3}.cs1 .gb.cur.g{background:#14b8a6}.cs1 .gb.cur.o{background:#e0913a}
  .cs2 .gb.prev{background:#eeecf3}.cs2 .gb.cur{background:#14b8a6}
  .cs3 .gb.prev{background:#eeecf3}.cs3 .gb.cur.g{background:#14b8a6}.cs3 .gb.cur.o{background:#e0483f}
  .cs4 .gb.prev{background:#b3e7dc}.cs4 .gb.cur{background:#0f9d84}
  .cs5 .gb.prev{background:#fbfafc;border:1.5px solid #d4d1dc}.cs5 .gb.cur{background:#14b8a6}
  .cs6 .gb.prev{background:#eeecf3}.cs6 .gb.cur.g{background:linear-gradient(#5fd3a0,#12a892)}.cs6 .gb.cur.o{background:linear-gradient(#f4bd6b,#df8b2f)}
  .cs7 .gb.prev{background:#e6e4ec}.cs7 .gb.prev.g{background:#a7e8da}.cs7 .gb.prev.o{background:#f6d6ab}.cs7 .gb.cur.g{background:#12a892}.cs7 .gb.cur.o{background:#e0913a}
  .cs8 .gb.prev{background:#e4e2ea}.cs8 .gb.cur{background:#38313f}
</style>
</head>
<body>

<div class="page-head">
  <h1>Còn lại · Cột kép — 8 cách dùng màu</h1>
  <p>Cùng biểu đồ cột kép (kỳ trước + kỳ này). Tám cách phối màu &amp; báo hiệu vượt/dưới chi tiêu.</p>
</div>

<div class="gallery" id="grid"></div>

<script>
  var PREV=[52,56,49,74,52,43,34], CUR=[42,66,29,50,65,null,null], CLS=['g','o','g','g','o',null,null], DAYS=['T2','T3','T4','T5','T6','T7','CN'];
  function chartHTML(cs){
    var cols='';
    for(var i=0;i<7;i++){
      var pc = CLS[i]?(' '+CLS[i]):'';
      var curEl = CUR[i]==null ? '' : '<div class="gb cur '+CLS[i]+'" style="height:'+CUR[i]+'px"></div>';
      cols += '<div class="col"><div class="gbwrap"><div class="gb prev'+pc+'" style="height:'+PREV[i]+'px"></div>'+curEl+'</div><span>'+DAYS[i]+'</span></div>';
    }
    return '<div class="ch"><div class="chart '+cs+'">'+cols+'</div><div class="dots"><i class="on"></i><i></i></div></div>';
  }
  function card(n,t,cs){
    return '<div class="v"><div class="cap"><span class="n">'+n+'</span><span class="t">'+t+'</span></div>'
      + '<div class="c"><div class="eyebrow">Còn lại tháng này</div><div class="big grad" style="font-size:29px;margin-top:5px">6.150.000 ₫</div>'
      + '<div class="io2"><div class="iotile"><div class="iolab">↑ Vào</div><div class="ioval up num">22.000.000</div></div><div class="iotile"><div class="iolab">↓ Ra</div><div class="ioval num">15.850.000</div></div></div>'
      + chartHTML(cs)
      + '<div class="note"><span class="ni">▼</span>Giảm <b>180.000 ₫</b> so với cùng kỳ tuần trước</div></div></div>';
  }
  var V=[
    ['1','Xanh / Cam (ngân sách)','cs1'],
    ['2','Một sắc teal','cs2'],
    ['3','Teal + Đỏ (cảnh báo)','cs3'],
    ['4','Cặp teal đậm / nhạt','cs4'],
    ['5','Kỳ trước viền · kỳ này đặc','cs5'],
    ['6','Gradient teal','cs6'],
    ['7','Cùng tông (nhạt cùng màu)','cs7'],
    ['8','Trung tính than chì','cs8']
  ];
  document.getElementById('grid').innerHTML = V.map(function(x){return card(x[0],x[1],x[2])}).join('');
</script>
</body>
</html>
