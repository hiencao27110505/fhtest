<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt giao dịch — widget số liệu &amp; danh mục</title>
<style>
:root{
  --sage-50:#ebfbf6;--sage-100:#d6f5eb;--sage-200:#afe9d8;--sage-300:#7ad5bd;--sage-400:#4abba1;--sage-500:#149d83;--sage-600:#007c65;--sage-800:#095143;
  --sage-wash:rgba(20,157,131,.18);
  --stone-25:#fafcfc;--stone-50:#f6f9f8;--stone-100:#f0f5f3;--stone-150:#ecf1f0;--stone-200:#e3eae7;--stone-300:#c3cdca;--stone-400:#7f8986;--stone-500:#6f7674;--stone-600:#626b68;--stone-800:#2e3835;--stone-900:#0e1613;
  --id-1:#0b67a9;--id-2:#5a94e0;--id-3:#9e5cd1;--id-4:#e6659c;--id-5:#b52f4a;--id-6:#bc6d24;
  --id-1-tint:#e5f4ff;--id-2-tint:#e7f3ff;--id-3-tint:#f6eeff;--id-4-tint:#ffebf2;--id-5-tint:#ffebed;--id-6-tint:#ffeee2;
  --brand:var(--sage-500);--brand-ink:var(--sage-600);--brand-tint:var(--sage-50);
  --grad-brand:linear-gradient(135deg,var(--sage-500),var(--sage-400));
  --ink:var(--stone-900);--ink-2:var(--stone-800);--muted:var(--stone-600);--muted-soft:var(--stone-500);
  --white:#fff;--canvas:var(--stone-100);--hairline:var(--stone-200);--divider:var(--stone-150);--surface:var(--stone-50);
  --shadow-card:0 1px 3px rgba(14,22,19,.05),0 8px 24px rgba(14,22,19,.04);
  --disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --text:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:1360px;margin:0 auto;padding:40px 24px 90px}
h1{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--brand-ink);text-transform:uppercase;margin-bottom:6px}
h2{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.5px;margin:44px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px}
figure{margin:0}
figcaption{padding:10px 4px 0;font-size:13.5px}
figcaption b{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--brand-ink);background:var(--brand-tint);border-radius:6px;padding:2px 7px;margin-right:7px}
figcaption span{font-weight:700;letter-spacing:-.2px}
.card{background:var(--white);border-radius:22px;box-shadow:var(--shadow-card);padding:16px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--muted-soft);text-transform:uppercase}
.pz{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px}
.pz b,.pz span{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:9px;color:var(--muted)}
.pz b{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(14,22,19,.08)}
.tile2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:10px 12px}
.tile .tl{font-size:11.5px;font-weight:600;color:var(--muted)}
.tile .tv{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.4px;margin-top:2px}
.up{color:var(--sage-600)}
.bars{display:flex;align-items:flex-end;gap:7px;height:84px;padding-top:16px}
.bars i{flex:1;background:var(--brand);border-radius:5px 5px 2px 2px;position:relative}
.bars i .v{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.bars i.dim{background:var(--sage-200)}
.xlab{display:flex;gap:7px;margin-top:6px}
.xlab s{flex:1;text-decoration:none;text-align:center;font-size:10px;color:var(--muted-soft)}
.crow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-top:1px solid var(--divider)}
.crow:first-of-type{border-top:0}
.crow .em{width:30px;height:30px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.crow .nm{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.1px}
.crow .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--muted-soft);margin-top:1px}
.crow .amt{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:-.3px}
.crow .pc{font-size:11.5px;color:var(--muted-soft);width:34px;text-align:right}
.trk{display:block;height:4px;border-radius:2px;background:var(--stone-150);margin-top:5px;overflow:hidden;position:relative}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--brand)}
.more{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--brand-ink);padding:10px 0 2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:3px;vertical-align:0}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
