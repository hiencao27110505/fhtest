[project]
name = "helloworld"
version = "0.1.0"
description = "HTTP Cloud Function: hello world"
requires-python = "==3.12.*"
dependencies = [
    "functions-framework==3.9.2",
]

# Entry point deployed to GCP. Read by `make deploy FN=helloworld`.
[tool.earthy.gcf]
entry-point = "hello_get"
trigger = "http"
region = "asia-southeast1"
runtime = "python312"
allow-unauthenticated = true

[tool.uv]
package = false
