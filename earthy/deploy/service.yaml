# Declarative Cloud Run service for @earthy/api.
#
# Apply with:
#   gcloud run services replace deploy/service.yaml --region=$REGION
#
# Substitute PROJECT_ID / REGION / IMAGE before applying, or use
# deploy/deploy.sh which does it for you. Secrets are referenced by name from
# Secret Manager, never inlined — this file is committed.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: earthy-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # The pg pool in @earthy/db holds connections per instance, so instance
        # count is really a database connection budget. Keep the ceiling low
        # enough that a traffic spike cannot exhaust Postgres.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Postgres over the public internet from a serverless runtime means TLS
        # handshakes on cold start; keeping concurrency high amortizes each
        # instance's pool across many requests instead of scaling out.
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      # The drain in src/index.ts is bounded at 8s, deliberately under Cloud
      # Run's own ~10s SIGTERM-to-SIGKILL window, so the shutdown completes on
      # our terms rather than being cut off mid-drain.
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            # Comma-separated browser origins. Must include the deployed web
            # app's exact scheme+host, or every cookie-authenticated fetch
            # fails CORS before reaching a route.
            - name: WEB_ORIGINS
              value: https://fhtest-opal.vercel.app
            - name: SUPABASE_URL
              value: https://iizyukzfsbdkbrgfupwq.supabase.co
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: https://earthy-api-860668973723.asia-southeast1.run.app/connections/callback
            - name: OAUTH_SUCCESS_REDIRECT
              value: https://fhtest-opal.vercel.app/?fh_gmail=1
            - name: OAUTH_FAILURE_REDIRECT
              value: https://fhtest-opal.vercel.app/
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: earthy-database-url
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: earthy-google-oauth-client-id
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: earthy-google-oauth-client-secret
                  key: latest
            - name: GMAIL_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: earthy-gmail-token-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
