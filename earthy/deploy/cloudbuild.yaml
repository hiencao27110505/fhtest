# Cloud Build pipeline for @earthy/api.
#
# Used both by deploy/deploy.sh (manual, from a laptop) and by a push trigger
# on the repo. Wire the trigger with deploy/setup.sh, which passes the same
# substitutions.
substitutions:
  _SERVICE: earthy-api
  _REGION: asia-southeast1
  _IMAGE: ""   # e.g. asia-southeast1-docker.pkg.dev/PROJECT/earthy/earthy-api
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    # The docker builder image does NOT enable BuildKit by default, and the
    # Dockerfile uses `RUN --mount=type=cache`, which is a BuildKit-only
    # feature — without this the build fails at the first such step with
    # "the --mount option requires BuildKit". Docker Desktop enables it
    # locally, which is why a build can pass on a laptop and fail here.
    - DOCKER_BUILDKIT=1

steps:
  # Pull the previous image so Docker can reuse the pnpm install layer; a cold
  # build reinstalls the whole workspace on every commit otherwise.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker pull ${_IMAGE}:latest || exit 0"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/api/Dockerfile
      # BuildKit treats an unresolvable --cache-from as a warning, not an
      # error, so the first build (nothing tagged :latest yet) still succeeds.
      - --cache-from=${_IMAGE}:latest
      # Cache metadata has to be WRITTEN into the pushed image for the next
      # build's --cache-from to find anything; BuildKit does not embed it by
      # default, so without this every build is cold.
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  # Image only. Env vars and secret bindings stay owned by
  # deploy/service.yaml so a code deploy never rewrites configuration.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --quiet

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
